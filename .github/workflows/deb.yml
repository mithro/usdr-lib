name: Build deb + publish apt repo

# Builds usdr .debs for Debian 13 (trixie) on a NATIVE arm64 runner so they
# install on the welland RPi fleet (rpi-sdr-xsdr is a Pi 5, arm64), plus amd64
# for completeness. Upstream ships bookworm/bionic packages only.
#
# The arm64 leg must be native: usdr-dkms is Architecture-specific and the other
# packages ship compiled binaries, so an amd64-only build would be unusable on
# the target (unlike dtbocfg, whose DKMS package is Architecture: all).

on:
  push:
    branches: [welland-packaging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git dpkg-dev debhelper dh-dkms \
            cmake python3 python3-yaml dwarves libusb-1.0-0-dev \
            libsoapysdr-dev check pkg-config

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust repo directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Take upstream's Debian packaging as-is
        # trixie is bookworm+1 and this is plain debhelper 13, so the bookworm
        # dir applies unmodified. Copying at build time (rather than vendoring)
        # means upstream packaging fixes are picked up automatically.
        run: cp -a packaging/debian-bookworm debian

      - name: Set changelog version from the pinned commit
        run: python3 packaging/deb-version.py --write-changelog

      - name: Show what we are building
        run: |
          echo "packaging HEAD: $(git rev-parse --short HEAD)"
          echo "version:        $(dpkg-parsechangelog -S Version)"

      - name: Build packages (binary-only)
        run: dpkg-buildpackage -b -us -uc

      - name: Collect debs
        run: |
          mkdir -p built-debs
          # usdr-dmonitor is a PyQt5 GUI debug tool and drags a desktop stack
          # onto headless fleet hosts; it is deliberately not published.
          for d in ../*.deb; do
            case "$(basename "$d")" in
              usdr-dmonitor_*) echo "skipping $(basename "$d")" ;;
              *) cp "$d" built-debs/ ;;
            esac
          done
          ls -l built-debs/

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: built-debs/

  publish-apt:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          merge-multiple: true
          path: apt-repo/

      - name: Generate apt repo metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils
          cd apt-repo
          dpkg-scanpackages --multiversion . > Packages
          gzip -k Packages
          cat > Release <<EOF
          Origin: mithro-usdr
          Label: mithro-usdr
          Suite: stable
          Codename: trixie
          Architectures: amd64 arm64 all
          Components: main
          Description: uSDR host libraries, tools and PCIe DKMS driver (Wavelet Lab XSDR), built for Debian 13 trixie
          EOF
          apt-ftparchive release . >> Release

      - name: Sign repo
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd apt-repo
          gpg --batch --yes --armor --detach-sign --output Release.gpg Release
          gpg --batch --yes --armor --clearsign --output InRelease Release
          # apt reads a keyring's format from its extension: .gpg must be
          # binary, .asc armoured. An armoured .gpg is invisible on trixie
          # (sqv reads both) but gpgv rejects it and the repo reads as
          # unsigned. Publish both, each under the extension apt expects.
          gpg --batch --yes --export > usdr.gpg
          gpg --batch --yes --armor --export > usdr.asc

      - name: Fetch the keyring checker
        if: hashFiles('apt-repo/usdr.gpg') != ''
        uses: actions/checkout@v4
        with:
          repository: mithro/apt-repo-action
          path: .apt-repo-action

      - name: Verify each keyring matches the format its extension promises
        if: hashFiles('apt-repo/usdr.gpg') != ''
        run: |
          python3 .apt-repo-action/scripts/check-keyrings.py \
            --binary apt-repo/usdr.gpg --armored apt-repo/usdr.asc

      - name: Create index page
        run: |
          cat > apt-repo/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html><head><title>mithro usdr apt repository</title></head>
          <body>
          <h1>mithro usdr apt repository</h1>
          <p>Snapshot build of <a href="https://github.com/wavelet-lab/usdr-lib">wavelet-lab/usdr-lib</a>
          for <b>Debian 13 (trixie)</b>, arm64 + amd64. Upstream ships bookworm and
          bionic packages only. Provides the uSDR host library, tools
          (<code>usdr_dm_create</code>, <code>usdr_dm_sensors</code>,
          <code>usdr_flash</code>), the SoapySDR module and the
          <code>usdr_pcie_uram</code> PCIe driver as DKMS.</p>
          <h2>Setup</h2>
          <pre>
          curl -fsSL https://mithro.github.io/usdr-lib/usdr.gpg \
            | sudo tee /etc/apt/keyrings/mithro-usdr.gpg > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/mithro-usdr.gpg] https://mithro.github.io/usdr-lib/ ./" \
            | sudo tee /etc/apt/sources.list.d/mithro-usdr.list
          sudo apt update
          sudo apt install usdr-tools usdr-dkms soapysdr-module-usdr
          </pre>
          </body></html>
          HTMLEOF
          sed -i 's/^          //' apt-repo/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo/
      - id: deploy
        uses: actions/deploy-pages@v4
